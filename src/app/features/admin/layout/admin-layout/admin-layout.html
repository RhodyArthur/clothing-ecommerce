<div class="flex h-screen bg-gray-50 overflow-hidden">
  <!-- ══════════════════════════════
       SIDEBAR
  ══════════════════════════════ -->

  <!-- Mobile overlay -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/40 z-30 lg:hidden"
      role="button"
      tabindex="0"
      (click)="sidebarOpen.set(false)"
      (keyup.enter)="sidebarOpen.set(false)"
    ></div>
  }

  <aside
    class="fixed lg:static inset-y-0 left-0 z-40 flex flex-col bg-white border-r border-gray-200 transition-transform duration-300 lg:translate-x-0"
    style="width: 240px"
    [style.transform]="sidebarOpen() ? 'translateX(0)' : ''"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <!-- Logo -->
    <div class="flex items-center gap-2 px-6 py-5 border-b border-gray-100">
      <a routerLink="/" class="text-base font-bold tracking-widest text-gray-900 no-underline">
        TheFooseGuy
      </a>
      <span class="text-xs font-medium text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">
        Admin
      </span>
    </div>

    <!-- Nav links -->
    <nav class="flex-1 px-3 py-4 flex flex-col gap-1 overflow-y-auto">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="!bg-gray-900 !text-white"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-600 no-underline hover:bg-gray-50 transition-colors"
          (click)="sidebarOpen.set(false)"
        >
          <i class="pi {{ item.icon }}" style="font-size: 0.875rem"></i>
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Storefront link -->
    <div class="px-3 pb-2 border-t border-gray-100 pt-3">
      <a
        routerLink="/"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-500 no-underline hover:bg-gray-50 transition-colors"
      >
        <i class="pi pi-external-link" style="font-size: 0.875rem"></i>
        View Storefront
      </a>
    </div>

    <!-- User info + sign out -->
    <div class="px-4 py-4 border-t border-gray-100">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-8 h-8 rounded-full bg-gray-900 flex items-center justify-center shrink-0">
          <span class="text-xs font-semibold text-white">
            {{ currentUser()?.user_metadata?.['full_name']?.[0]?.toUpperCase() || 'A' }}
          </span>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-medium text-gray-900 truncate">
            {{ currentUser()?.user_metadata?.['full_name'] || 'Admin' }}
          </p>
          <p class="text-xs text-gray-400 truncate">
            {{ currentUser()?.email }}
          </p>
        </div>
      </div>
      <button
        (click)="signOut()"
        class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs text-red-500 bg-transparent border-none cursor-pointer hover:bg-red-50 transition-colors text-left"
      >
        <i class="pi pi-sign-out" style="font-size: 0.75rem"></i>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- ══════════════════════════════
       MAIN CONTENT
  ══════════════════════════════ -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Top bar -->
    <header class="flex items-center gap-4 bg-white border-b border-gray-200 px-6 py-4 shrink-0">
      <!-- Mobile hamburger -->
      <button
        class="lg:hidden flex items-center justify-center w-8 h-8 bg-transparent border-none cursor-pointer text-gray-600"
        (click)="sidebarOpen.set(true)"
      >
        <i class="pi pi-bars" style="font-size: 1rem"></i>
      </button>

      <!-- Page title (router-driven) -->
      <div class="flex-1"></div>

      <!-- Quick actions -->
      <a
        routerLink="/admin/products/new"
        class="flex items-center gap-2 px-3 py-1.5 bg-gray-900 text-white text-xs font-medium rounded-md no-underline hover:opacity-85 transition-opacity"
      >
        <i class="pi pi-plus" style="font-size: 0.7rem"></i>
        Add Product
      </a>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
