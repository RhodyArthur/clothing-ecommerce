<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">
  <div class="w-full max-w-md">

    <div class="bg-white border border-gray-200 rounded-xl p-8">

      @if (success()) {
        <div class="text-center py-4">
          <div class="w-14 h-14 rounded-full bg-green-100 flex items-center
                      justify-center mx-auto mb-4">
            <i class="pi pi-check text-green-600" style="font-size:1.5rem;"></i>
          </div>
          <h2 class="text-lg font-bold text-gray-900 mb-2">Password updated</h2>
          <p class="text-sm text-gray-500">Redirecting you to sign in...</p>
        </div>

      } @else {
        <h1 class="text-xl font-bold text-gray-900 mb-1">Set new password</h1>
        <p class="text-sm text-gray-400 mb-6">Must be at least 6 characters.</p>

        @if (error()) {
          <p-message severity="error" [text]="error()!" styleClass="w-full mb-4" />
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

          <div class="flex flex-col gap-1.5">
            <label for="password" class="text-xs font-medium text-gray-700">
              New Password <span class="text-red-500">*</span>
            </label>
            <p-password
              id="password"
              formControlName="password"
              placeholder="Min. 6 characters"
              [toggleMask]="true"
              styleClass="w-full"
              inputStyleClass="w-full"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="confirm-password" class="text-xs font-medium text-gray-700">
              Confirm Password <span class="text-red-500">*</span>
            </label>
            <p-password
              id="confirm-password"
              formControlName="confirmPassword"
              placeholder="••••••••"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full"
              inputStyleClass="w-full"
            />
            @if (passwordMismatch) {
              <span class="text-xs text-red-500">Passwords do not match</span>
            }
          </div>

          <p-button
            type="submit"
            label="Update Password"
            [loading]="submitting()"
            styleClass="w-full !bg-gray-900 !border-gray-900 !text-white
                        hover:!opacity-85 !mt-2"
          />

        </form>
      }

    </div>
  </div>
</div>
