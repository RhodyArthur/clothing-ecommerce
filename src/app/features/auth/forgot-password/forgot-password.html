<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">
  <div class="w-full max-w-md">

    <div class="bg-white border border-gray-200 rounded-xl p-8">

      @if (sent()) {
        <div class="text-center py-4">
          <div class="w-14 h-14 rounded-full bg-green-100 flex items-center
                      justify-center mx-auto mb-4">
            <i class="pi pi-envelope text-green-600" style="font-size:1.5rem;"></i>
          </div>
          <h2 class="text-lg font-bold text-gray-900 mb-2">Check your email</h2>
          <p class="text-sm text-gray-500 mb-6 leading-relaxed">
            We sent a password reset link to
            <span class="font-medium text-gray-900">{{ form.value.email }}</span>.
          </p>
          <a routerLink="/auth/login"
             class="text-sm font-medium text-gray-900 no-underline hover:underline">
            Back to sign in
          </a>
        </div>

      } @else {
        <h1 class="text-xl font-bold text-gray-900 mb-1">Forgot your password?</h1>
        <p class="text-sm text-gray-400 mb-6">
          Enter your email and we'll send you a reset link.
        </p>

        @if (error()) {
          <p-message severity="error" [text]="error()!" styleClass="w-full mb-4" />
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="email" class="text-xs font-medium text-gray-700">
              Email <span class="text-red-500">*</span>
            </label>
            <input
              id="email"
              pInputText
              formControlName="email"
              type="email"
              placeholder="your@email.com"
              class="w-full"
            />
          </div>

          <p-button
            type="submit"
            label="Send Reset Link"
            [loading]="submitting()"
            styleClass="w-full !bg-gray-900 !border-gray-900 !text-white hover:!opacity-85"
          />
        </form>

        <p class="text-center text-sm text-gray-400 mt-6">
          Remember your password?
          <a routerLink="/auth/login"
             class="text-gray-900 font-medium no-underline hover:underline">
            Sign in
          </a>
        </p>
      }

    </div>
  </div>
</div>
