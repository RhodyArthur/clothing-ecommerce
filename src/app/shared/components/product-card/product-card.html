<a [routerLink]="['/products', product().id]" class="group block no-underline text-inherit">
  <!-- Image container -->
  <div class="relative overflow-hidden rounded-sm bg-gray-100 mb-2.5 aspect-square">
    <img
      [src]="product().image_urls[0] || 'assets/images/placeholder-image.png'"
      [alt]="product().name"
      class="w-full h-full object-cover transition-transform duration-450 ease-in-out group-hover:scale-[1.03]"
    />

    <!-- Wishlist button — top right, always visible -->
    <button
      (click)="toggleWishlist($event)"
      class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white border-none flex items-center justify-center cursor-pointer shadow-sm transition-transform duration-150 hover:scale-110 z-10"
      aria-label="Toggle wishlist"
    >
      <i
        [class]="isWishlisted() ? 'pi pi-heart-fill' : 'pi pi-heart'"
        [style.color]="isWishlisted() ? '#dc2626' : '#1a1a1a'"
        style="font-size: 13px"
      ></i>
    </button>

    <!-- Mobile: quick cart icon (bottom-right) -->
    <button
      (click)="onMobileCartClick($event)"
      class="absolute bottom-2 left-2 w-8 h-8 rounded-full bg-white border-none flex items-center justify-center cursor-pointer shadow-sm transition-transform duration-150 hover:scale-110 z-10 md:hidden"
      aria-label="Add to cart"
    >
      <i class="pi pi-shopping-cart" style="font-size: 13px"></i>
    </button>

    <!-- Quick add / Select options — visible on md+ via hover (hidden on mobile) -->
    <div
      class="absolute bottom-0 left-0 right-0 hidden md:block translate-y-full md:group-hover:translate-y-0 transition-transform duration-300 ease-out z-10"
    >
      @if (canQuickAdd()) {
        <!-- Single variant → add directly (styled pill button) -->
        <button
          (click)="quickAdd($event)"
          class="w-36 mx-auto mb-2 py-2.5 bg-linear-to-r from-gray-900 to-gray-800 text-white text-sm font-semibold tracking-wide rounded-full shadow-lg flex items-center justify-center gap-2 border-0 cursor-pointer hover:from-gray-800 hover:to-gray-700 active:scale-95 transform transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300"
          aria-label="Add to cart"
        >
          <i class="pi pi-shopping-cart text-xs"></i>
          <span>Add to cart</span>
        </button>
      } @else {
        <!-- Multiple variants → go to detail -->
        <a
          [routerLink]="['/products', product().id]"
          class="block w-36 mx-auto mb-2 py-2.5 bg-linear-to-r from-gray-900 to-gray-800 text-white text-sm font-semibold tracking-wide text-center no-underline rounded-full shadow-md hover:from-gray-800 hover:to-gray-700 transition-all duration-150"
          (click)="$event.stopPropagation()"
        >
          Choose size & color
        </a>
      }
    </div>

    <!-- Out of stock badge -->
    @if (product().stock_count === 0) {
      <span
        class="absolute bottom-2 left-2 px-2 py-0.5 bg-black/70 text-white text-[0.65rem] rounded-sm tracking-[0.05em] z-10"
      >
        OUT OF STOCK
      </span>
    }
  </div>

  <!-- Info -->
  <p class="text-sm text-gray-900 mb-0.5 truncate">{{ product().name }}</p>
  <p class="text-[0.7rem] text-gray-400 uppercase tracking-[0.06em] mb-0.5">
    {{ product().category }}
  </p>
  <p class="text-sm font-medium text-gray-700">GHS {{ product().price | number: '1.2-2' }}</p>
</a>
