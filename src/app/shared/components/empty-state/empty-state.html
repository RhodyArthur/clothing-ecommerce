<div class="flex flex-col items-center justify-center py-16 text-center px-4">
  <i [class]="icon()" style="font-size: 2.5rem"></i>
  <h3 class="mt-4 text-lg font-semibold text-gray-900">{{ title() }}</h3>
  @if (description()) {
    <p class="mt-2 text-sm text-gray-500 max-w-md">{{ description() }}</p>
  }

  @if (actionLabel()) {
    <div class="mt-6">
      @if (actionRouterLink()) {
        <a
          [routerLink]="actionRouterLink()"
          (click)="onAction()"
          class="inline-flex items-center gap-2 bg-gray-900 text-white text-sm font-medium tracking-wide px-4 py-2 rounded border border-gray-300 hover:bg-gray-50 hover:text-gray-900"
        >
          {{ actionLabel() }}
        </a>
      } @else {
        <p-button
          [label]="actionLabel()"
          (onClick)="onAction()"
          styleClass="!bg-gray-900 !border-gray-900 !text-white"
        />
      }
    </div>
  }
</div>
